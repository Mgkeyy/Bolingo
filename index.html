 const draw=()=>{$('ph').innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');if(photos[i]){d.style.backgroundImage=`url(${photos[i]})`;const b=document.createElement('button');b.textContent='✕';b.onclick=()=>{photos.splice(i,1);draw()};d.appendChild(b)}else{d.textContent='+';d.onclick=()=>$('file').click()}$('ph').appendChild(d)}};draw();

function pass(u){
 if(u.id===uid||!u.name||!(u.photos&&u.photos.length)||u.hidden||blocked.has(u.id))return false;
 if(flt.intent&&u.intent!==flt.intent)return false;
 const a=age(u.birth),Lw=s=>(s||'').toLowerCase();
 if(me.seeking&&me.seeking!=='Tous'&&u.gender!==me.seeking)return false;
 if(u.seeking&&u.seeking!=='Tous'&&me.gender&&me.gender!==u.seeking)return false;
 if(flt.amin&&a<flt.amin)return false;if(flt.amax&&a>flt.amax)return false;if(flt.hmin&&(u.height||0)<flt.hmin)return false;
 if(flt.city&&!Lw(u.city).includes(Lw(flt.city)))return false;if(flt.school&&!Lw(u.school).includes(Lw(flt.school)))return false;if(flt.church&&!Lw(u.church).includes(Lw(flt.church)))return false;
 if(flt.religion&&u.religion!==flt.religion)return false;if(flt.interest&&!(u.interests||[]).some(i=>Lw(i).includes(Lw(flt.interest))))return false;return true}
const hay=u=>[u.name,u.lastName,u.city,u.job,u.school,u.church,u.religion,(u.interests||[]).join(' ')].join(' ').toLowerCase();
async function doSwipe(u,type){await db.doc('swipes/'+uid+'_'+u.id).set({from:uid,to:u.id,type,at:TS(),reshow:(u._re||0)+(u._again?1:0)});
 if(type!=='pass'){notify(u.id,type);const b=await db.doc('swipes/'+u.id+'_'+uid).get();
  if(b.exists&&b.data().type!=='pass'){const us=[uid,u.id].sort();await db.doc('matches/'+us.join('_')).set({users:us,at:TS()});notify(u.id,'match');return true}}return false}

 $('inv').onclick=share;
 $('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();$('dk').style.display=q?'none':'';$('res').innerHTML='';if(!q)return;
  const r=allUsers.filter(u=>u.id!==uid&&u.name&&!u.hidden&&!blocked.has(u.id)&&hay(u).includes(q)).slice(0,30);

  r.forEach(u=>{const it=document.createElement('div');it.className='item';it.innerHTML=`<div class="av" style="${bg(u)}">${u.photos?'':esc(u.name[0])}</div><div><b>${esc(u.name)} ${esc(u.lastName)}${age(u.birth)?', '+age(u.birth):''}</b><div class="muted" style="text-align:left;font-size:13px">${[u.job,u.city].filter(Boolean).map(esc).join(' · ')}</div></div>`;it.onclick=()=>detail(u,{like:1});$('res').appendChild(it)})};
 try{const done=new Map();(await db.collection('swipes').where('from','==',uid).get()).forEach(d=>done.set(d.data().to,d.data()));
  allUsers=[];(await db.collection('users').limit(200).get()).forEach(d=>allUsers.push({id:d.id,...d.data()}));
  const deck=allUsers.filter(u=>{const d=done.get(u.id);if(d){if(!(d.type==='pass'&&bst(u)&&(d.reshow||0)<3))return false;u._again=true;u._re=d.reshow||0}else{u._again=false;u._re=0}return pass(u)}).sort(()=>Math.random()-.5).sort((a,b)=>bst(b)-bst(a)||Math.floor((compat(b)||0)/10)-Math.floor((compat(a)||0)/10));showDeck(deck)}
 catch(e){$('dk').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function cardHTML(u,back){
 return `<div class="card ${back?'back':''}" style="${bg(u)}">${back?'':`<div class="dots">${(u.photos||[]).map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>${bst(u)?'<div class="bdg">⭐ Boost</div>':''}<div class="stamp st-l">LIKE</div><div class="stamp st-n">NOPE</div><button class="ibtn">ℹ</button>`}

function showDeck(deck){
 const dk=$('dk');if(!dk)return;
 if(!deck.length){dk.innerHTML=`<div class="box muted"><h2>${t('Plus personne pour l’instant')}</h2><p>${t('Élargis tes filtres ou reviens plus tard.')}</p><button class="btn" id="r">${t('Actualiser')}</button></div>`;$('r').onclick=viewSwipe;return}
 const u=deck[0];dk.innerHTML=`<div class="stack">${deck[1]?cardHTML(deck[1],1):''}${cardHTML(u)}</div><div class="acts"><button id="no">✕</button><button id="sm" class="sm">💥</button><button id="yes">♥</button></div>`;
 const c=dk.querySelectorAll('.card'),top=c[c.length-1],sl=top.querySelector('.st-l'),sn=top.querySelector('.st-n'),dots=top.querySelectorAll('.dots i');let pi=0,busy=false;
 const next=()=>{deck.shift();showDeck(deck)};
 const act=async type=>{if(busy)return;busy=true;top.style.transition='transform .35s';top.style.transform=type==='smash'?'translate(0,-800px) scale(1.1)':`translate(${type==='like'?600:-600}px,0) rotate(${type==='like'?30:-30}deg)`;if(type!=='pass')burst(type==='smash'?'💥':'❤️',type==='smash'?10:6);
  try{if(await doSwipe(u,type))setTimeout(()=>matchPop(u),250)}catch(e){alert(e.message)}setTimeout(next,300)};
 let sx=0,sy=0,dx=0,dy=0,drag=false,moved=false;
 top.onpointerdown=e=>{if(e.target.closest('.ibtn'))return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;top.style.transition='none';top.setPointerCapture(e.pointerId)};
 top.onpointermove=e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;top.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/18}deg)`;sl.style.opacity=Math.max(0,dx/100);sn.style.opacity=Math.max(0,-dx/100)};
 top.onpointerup=e=>{if(!drag)return;drag=false;if(dx>110)return act('like');if(dx<-110)return act('pass');if(dy<-130&&Math.abs(dx)<90)return act('smash');
  top.style.transition='transform .25s';top.style.transform='';sl.style.opacity=sn.style.opacity=0;
  if(!moved){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.closest('.info'))return detail(u,{like:1})}
  if(!moved&&u.photos.length>1){const r=top.getBoundingClientRect();pi=(e.clientX-r.left>r.width/2)?(pi+1)%u.photos.length:(pi-1+u.photos.length)%u.photos.length;top.style.backgroundImage=`url(${u.photos[pi]})`;dots.forEach((d,i)=>d.classList.toggle('on',i===pi))}};
 top.querySelector('.ibtn').onclick=()=>detail(u);$('no').onclick=()=>act('pass');$('yes').onclick=()=>act('like');$('sm').onclick=()=>act('smash')}

 j=jac(a.interests,b.interests);if(j!=null)add(10,10*Math.min(1,j*2));
 [['intent',20],['lifestyle',10],['kids',10],['smoke',5],['drink',5]].forEach(([k,x])=>{if(a[k]&&b[k])add(x,a[k]===b[k]?x:0)});
 return w>=25?Math.round(100*sc/w):null}
const PM=[['👤','info','Informations personnelles','Personal information','Photos, noms, naissance, préférences.','Photos, names, birth date, preferences.'],['🖼','album','Album','Album','Toutes tes photos au même endroit, enregistrables.','All your photos in one place, savable.'],['📰','wall','Mon mur','My wall','Tout ce que tu as publié et republié, comme une file d’actualité.','Everything you posted and reshared, like a timeline.'],['💞','compat','Compatibilité','Compatibility','Quelques choix à cocher pour trouver des profils qui te ressemblent.','A few choices to find profiles like you.'],['📊','stats','Statistiques','Statistics','Qui t’aime, tes matchs, les vues de tes stories.','Who likes you, your matches, story views.'],['✅','verify','Vérification','Verification','Un badge bleu rassure et inspire confiance.','A blue badge builds trust.'],['⭐','stars','Étoiles et boost','Stars and boost','Invite des amis et fais ressortir ton profil.','Invite friends and make your profile stand out.'],['🔒','privacy','Confidentialité','Privacy','Mode invisible, membres bloqués, langue.','Invisible mode, blocked members, language.']];

 $('pv').onclick=()=>detail(Object.assign({},me,{id:uid}));
 PM.forEach(m=>{const it=document.createElement('div');it.className='item';it.innerHTML=`<div style="font-size:26px;width:36px;text-align:center">${m[0]}</div><div style="flex:1"><b>${L(m[2],m[3])}</b><div class="muted" style="text-align:left;font-size:13px">${L(m[4],m[5])}</div></div><span class="muted">›</span>`;
  it.onclick=()=>{if(m[1]==='verify')verifySheet();else if(m[1]==='stars'||m[1]==='privacy')go('settings');else go(m[1])};$('pm').appendChild(it)})}
const bkBtn=()=>`<button class="btn s" id="bkp" style="margin:0 0 10px;width:auto;padding:8px 14px">←</button>`;
async function viewAlbum(){app.innerHTML=bkBtn()+`<h3 style="margin-top:0">🖼 Album</h3><div id="ac"><div class="spin"></div></div>`;$('bkp').onclick=()=>go('profile');
 try{albumInto($('ac'),Object.assign({},me,{id:uid}),await userPosts(uid))}catch(e){$('ac').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function viewWall(){app.innerHTML=bkBtn()+`<h3 style="margin-top:0">📰 ${L('Mon mur','My wall')}</h3><button class="btn" id="np" style="margin:0 0 8px">${L('Publier un moment','Post a moment')}</button><div id="wl"><div class="spin"></div></div>`;$('bkp').onclick=()=>go('profile');$('np').onclick=()=>go('moments');
 try{await loadUsers();wallInto($('wl'),await userPosts(uid))}catch(e){$('wl').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function viewCompat(){
 const sel={};CQ.forEach(([k,,,m])=>{sel[k]=m?[...(me[k]||[])]:(me[k]||'')});
 app.innerHTML=bkBtn()+`<div class="box"><h3 style="margin-top:0">💞 ${L('Compatibilité','Compatibility')}</h3><p class="muted" style="text-align:left;margin:0">${L('Tes réponses servent à calculer un pourcentage de compatibilité avec les autres membres et à te suggérer des profils.','Your answers are used to compute a compatibility score with other members and to suggest profiles.')}</p><div id="cq"></div><button class="btn" id="cs">${t('Enregistrer')}</button></div>`;
 $('bkp').onclick=()=>go('profile');const cq=$('cq');
 CQ.forEach(([k,lab,opts,m])=>{const h=document.createElement('div');h.innerHTML=`<label style="display:block;margin-top:12px">${t(lab)}</label>`;

   b.onclick=()=>{if(m)sel[k]=on()?sel[k].filter(x=>x!==o):[...sel[k],o];else sel[k]=on()?'':o;h.querySelectorAll('.opt').forEach(x=>x._p())};h.appendChild(b)});cq.appendChild(h)});
 $('cs').onclick=async()=>{try{await db.doc('users/'+uid).set(sel,{merge:true});me={...me,...sel};toast(L('Réponses enregistrées ✔','Answers saved ✔'),1);go('profile')}catch(e){alert(e.message)}}}
async function viewStats(){spin();let r=null,er='';
 try{const [lk,pt,sv,rf]=await Promise.all([db.collection('swipes').where('to','==',uid).get(),db.collection('posts').where('from','==',uid).get(),db.collection('storyviews').where('owner','==',uid).get(),db.collection('referrals').where('inviter','==',uid).get()]);
  let likes=0,smash=0,pl=0;lk.forEach(d=>{const x=d.data().type;if(x==='like')likes++;if(x==='smash')smash++});pt.forEach(d=>pl+=(d.data().likes||[]).length);
  r=[['❤️',L('J’aime reçus','Likes received'),likes],['💥','Smash',smash],['💞',L('Matchs','Matches'),mats.length],['📰',L('Publications','Posts'),pt.size],['👍',L('J’aime sur tes publications','Likes on your posts'),pl],['👁',L('Vues de tes stories','Story views'),sv.size],['⭐',L('Amis parrainés','Friends invited'),rf.size]]}catch(e){er=e.code||e.message}
 app.innerHTML=bkBtn()+`<div class="box"><h3 style="margin-top:0">📊 ${L('Statistiques','Statistics')}</h3>${er?`<p class="err">${esc(er)}</p>`:r.map(x=>`<div class="sw"><span>${x[0]} ${x[1]}</span><b>${x[2]}</b></div>`).join('')}</div>`;$('bkp').onclick=()=>go('profile')}

function viewVerify(u){nav.style.display='none';$('hf').style.display='none';$('hb').style.display='none';buildNav();
 app.innerHTML=`<div class="box" style="text-align:center"><div class="hero">${LOGO(72)}</div><h2>${L('Vérifie ton e-mail','Verify your email')}</h2><p class="muted">${L('Nous avons envoyé un lien de vérification à','We sent a verification link to')}<br><b>${esc(u.email)}</b><br>${L('Ouvre-le, puis reviens ici. Regarde aussi dans les spams.','Open it, then come back here. Check your spam folder too.')}</p><div class="err" id="er"></div><button class="btn" id="vk">${L('J’ai vérifié mon e-mail','I verified my email')}</button><button class="btn s" id="vr">${L('Renvoyer le lien','Resend the link')}</button><button class="btn s" id="vo">${t('Se déconnecter')}</button></div>`;
 const ok2=async()=>{await auth.currentUser.getIdToken(true);location.reload()};
 $('vk').onclick=async()=>{try{await u.reload();if(auth.currentUser.emailVerified)await ok2();else $('er').textContent=L('Pas encore vérifié. Ouvre le lien reçu par e-mail.','Not verified yet. Open the link sent by email.')}catch(e){$('er').textContent=fr(e)}};
 $('vo').onclick=()=>auth.signOut();
 $('vr').onclick=async()=>{try{await u.sendEmailVerification();$('er').textContent=L('Lien renvoyé.','Link sent.')}catch(e){$('er').textContent=fr(e)}};
 const iv=setInterval(async()=>{if(!$('vk')){clearInterval(iv);return}try{await u.reload();if(auth.currentUser.emailVerified){clearInterval(iv);await ok2()}}catch(e){}},5000)}
function admInfo(u){const o=document.createElement('div');o.className='ov';
 const rows=Object.entries(u).filter(([k])=>!['photos','id'].includes(k)).map(([k,v])=>`<p style="margin:4px 0;word-break:break-word"><b>${esc(k)} :</b> ${esc(typeof v==='object'?JSON.stringify(v):v)}</p>`).join('');
 o.innerHTML=`<div class="sheet"><h3 style="margin-top:0">${esc(u.name)} ${esc(u.lastName)}</h3><p class="muted" style="font-size:12px;word-break:break-all;text-align:left">UID : ${esc(u.id)}</p>${(u.photos||[]).map(p=>`<img class="big" src="${p}">`).join('')}${rows}<button class="btn" id="cli">Fermer</button></div>`;

async function admConvos(u,reason){
 const why=reason||prompt('Motif de la consultation (obligatoire, ex : signalement de harcèlement) :');
 if(!why||why.trim().length<5){alert('Motif obligatoire (5 caractères minimum).');return}
 try{const s=await db.collection('matches').where('users','array-contains',u.id).get();
  await db.collection('adminLogs').add({admin:uid,target:u.id,action:'list_conversations',reason:why.trim(),at:TS()});
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="sheet"><h3 style="margin-top:0">💬 ${esc(u.name)}</h3><p class="muted" style="text-align:left;font-size:12px">Lecture seule : aucun accusé de lecture ni notification n’est envoyé aux membres. Chaque consultation est enregistrée dans le journal.</p><div id="cv"></div><button class="btn" id="cx2">Fermer</button></div>`;
  document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};$('cx2').onclick=()=>o.remove();
  const cv=$('cv');if(s.empty)cv.innerHTML='<p class="muted">Aucune conversation.</p>';
  s.forEach(d=>{const m=d.data(),oid=m.users.find(x=>x!==u.id),w=uOf(oid);cv.appendChild(userRow(w,()=>admRead(d.id,u,w,why)))})}catch(e){alert(e.message)}}
async function admRead(mid,u,w,why){
 try{const s=await db.collection('matches/'+mid+'/messages').orderBy('at').get();
  await db.collection('adminLogs').add({admin:uid,target:u.id,action:'read_conversation',matchId:mid,reason:why.trim(),at:TS()});
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="sheet"><h3 style="margin-top:0">${esc(u.name)} ↔ ${esc(w.name)}</h3><div id="mg"></div><button class="btn" id="cx3">Fermer</button></div>`;
  document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};$('cx3').onclick=()=>o.remove();
  const g=$('mg');if(s.empty)g.innerHTML='<p class="muted">Aucun message.</p>';
  s.forEach(d=>{const x=d.data(),p=document.createElement('p');p.style.cssText='margin:8px 0;word-break:break-word';
   p.innerHTML=`<b>${esc(uOf(x.from).name)}</b> <span class="muted" style="font-size:12px">${x.at?x.at.toDate().toLocaleString():''}</span><br>`;
   if(x.img){const i=document.createElement('img');i.src=x.img;i.style.cssText='max-width:70%;border-radius:10px';i.onclick=()=>openImg(x.img);p.appendChild(i)}else p.appendChild(document.createTextNode(x.text));g.appendChild(p)})}catch(e){alert(e.message)}}

history.replaceState({r:1},'');history.pushState({a:1},'');
new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(n=>{if(n.classList&&(n.classList.contains('ov')||n.classList.contains('view')))ensureState()}))).observe(document.body,{childList:true});

document.documentElement.lang=lang;if(LS.g('dm'))document.body.classList.add('dark');buildNav();$('hb').onclick=()=>go('notifs');

 if(me.warning&&LS.g('w')!==me.warning){LS.s('w',me.warning);alert('⚠️ '+me.warning)}
 $('hb').style.display='';unL=listen();ping();
 if(!me.name||!me.gender||!(me.photos&&me.photos.length)){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==='profile'));viewProfile(true)}else go('swipe')});
