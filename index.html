.ph div button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff}

.spin{width:34px;height:34px;border:4px solid #fecdd3;border-top-color:#e11d48;border-radius:50%;animation:r 1s linear infinite;margin:40px auto}@keyframes r{to{transform:rotate(360deg)}}

<script>

/* ---- Connexion ---- */
function viewAuth(mode='in'){
 nav.style.display='none';$('hf').style.display='none';
 app.innerHTML=`<div class="box"><div class="tabs"><button id="t1" class="${mode==='in'?'on':''}">Connexion</button><button id="t2" class="${mode==='up'?'on':''}">Inscription</button></div>

const REL=['','Chrétien','Catholique','Protestant','Musulman','Kimbanguiste','Autre','Sans religion'];
function resize(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const m=640,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(file)})}
function viewProfile(first){
 const p=me,photos=[...(p.photos||[])];
 const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 const inp=(id,l,v,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}>`;
 app.innerHTML=`<div class="box"><h2 style="margin-top:0">${first?'Crée ton profil':'Mon profil'}</h2>
 <label>Photos (1 à 3, la première est la principale)</label><div class="ph" id="ph"></div>
 <input id="file" type="file" accept="image/*" style="display:none">
 <div class="g">${inp('name','Prénom *',p.name,'text','maxlength=40')}${inp('lastName','Nom',p.lastName,'text','maxlength=40')}</div>
 <div class="g"><div><label>Genre *</label>${sel('gender',['','Homme','Femme'],p.gender)}</div><div><label>Je recherche</label>${sel('seeking',['Tous','Homme','Femme'],p.seeking||'Tous')}</div></div>
 ${inp('birth','Date de naissance * (18 ans min.)',p.birth,'date')}
 <div class="g">${inp('city','Commune / Ville',p.city)}${inp('height','Taille (cm)',p.height,'number','min=120 max=230')}</div>
 ${inp('job','Poste / Profession',p.job)}${inp('school','Université / École',p.school)}${inp('church','Église / Communauté',p.church)}
 <label>Religion</label>${sel('religion',REL,p.religion)}
 ${inp('interests','Centres d’intérêt (séparés par des virgules)',(p.interests||[]).join(', '))}
 <label>À propos de moi</label><textarea id="bio" rows="4" maxlength="400">${esc(p.bio)}</textarea>
 <div class="err" id="err"></div><button class="btn" id="save">Enregistrer</button>
 ${first?'':'<button class="btn s" id="out">Se déconnecter</button>'}</div>`;
 const draw=()=>{$('ph').innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');if(photos[i]){d.style.backgroundImage=`url(${photos[i]})`;const b=document.createElement('button');b.textContent='✕';b.onclick=()=>{photos.splice(i,1);draw()};d.appendChild(b)}else{d.textContent='+';d.onclick=()=>$('file').click()}$('ph').appendChild(d)}};draw();
 $('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{photos.push(await resize(f));draw()}catch(x){$('err').textContent='Photo illisible.'}};
 const v=id=>$(id).value.trim();
 $('save').onclick=async()=>{const er=m=>$('err').textContent=m;
  if(!v('name'))return er('Le prénom est obligatoire.');if(!$('gender').value)return er('Choisis ton genre.');
  const a=age(v('birth'));if(a===null||a<18)return er('Tu dois avoir 18 ans ou plus.');if(!photos.length)return er('Ajoute au moins une photo.');
  const d={name:v('name'),lastName:v('lastName'),gender:$('gender').value,seeking:$('seeking').value,birth:v('birth'),city:v('city'),height:Number(v('height'))||null,job:v('job'),school:v('school'),church:v('church'),religion:$('religion').value,interests:v('interests').split(',').map(s=>s.trim()).filter(Boolean).slice(0,12),bio:v('bio'),photos};
  $('save').disabled=true;try{await db.doc('users/'+uid).set(d,{merge:true});me={...me,...d};go('swipe')}catch(x){er(x.message);$('save').disabled=false}};
 if($('out'))$('out').onclick=()=>auth.signOut();
}

/* ---- Découvrir ---- */
function pass(u){
 if(u.id===uid||!u.name||!(u.photos&&u.photos.length))return false;
 const a=age(u.birth),L=s=>(s||'').toLowerCase();
 if(me.seeking&&me.seeking!=='Tous'&&u.gender!==me.seeking)return false;
 if(u.seeking&&u.seeking!=='Tous'&&me.gender&&me.gender!==u.seeking)return false;
 if(flt.amin&&a<flt.amin)return false;if(flt.amax&&a>flt.amax)return false;
 if(flt.hmin&&(u.height||0)<flt.hmin)return false;
 if(flt.city&&!L(u.city).includes(L(flt.city)))return false;
 if(flt.school&&!L(u.school).includes(L(flt.school)))return false;
 if(flt.church&&!L(u.church).includes(L(flt.church)))return false;
 if(flt.religion&&u.religion!==flt.religion)return false;
 if(flt.interest&&!(u.interests||[]).some(i=>L(i).includes(L(flt.interest))))return false;
 return true}
async function viewSwipe(){
 spin();
 try{const done=new Set();(await db.collection('swipes').where('from','==',uid).get()).forEach(d=>done.add(d.data().to));
  const deck=[];(await db.collection('users').limit(80).get()).forEach(d=>{const u={id:d.id,...d.data()};if(!done.has(u.id)&&pass(u))deck.push(u)});
  deck.sort(()=>Math.random()-.5);showDeck(deck)}catch(e){app.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function cardHTML(u,back){const n=(u.photos||[]).length;
 return `<div class="card ${back?'back':''}" style="${bg(u)}">${back?'':`<div class="dots">${(u.photos||[]).map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><div class="stamp st-l">LIKE</div><div class="stamp st-n">NOPE</div><button class="ibtn">ℹ</button>`}
 <div class="info"><h2>${esc(u.name)}${age(u.birth)?', '+age(u.birth):''}</h2><p>${[u.job,u.city].filter(Boolean).map(esc).join(' · ')}</p>${(u.interests||[]).slice(0,4).map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`}
function showDeck(deck){
 if(!deck.length){app.innerHTML='<div class="box muted"><h2>Plus personne pour l’instant</h2><p>Élargis tes filtres ou reviens plus tard.</p><button class="btn" id="r">Actualiser</button></div>';$('r').onclick=viewSwipe;return}
 const u=deck[0];
 app.innerHTML=`<div class="stack" id="st">${deck[1]?cardHTML(deck[1],1):''}${cardHTML(u)}</div><div class="acts"><button id="no">✕</button><button id="yes">♥</button></div>`;
 const c=app.querySelectorAll('.card');const top=c[c.length-1],sl=top.querySelector('.st-l'),sn=top.querySelector('.st-n'),dots=top.querySelectorAll('.dots i');let pi=0,busy=false;
 const next=()=>{deck.shift();showDeck(deck)};
 const act=async(type)=>{if(busy)return;busy=true;top.style.transition='transform .35s';top.style.transform=`translate(${type==='like'?600:-600}px,0) rotate(${type==='like'?30:-30}deg)`;
  try{await db.doc('swipes/'+uid+'_'+u.id).set({from:uid,to:u.id,type,at:TS()});
   if(type==='like'){const b=await db.doc('swipes/'+u.id+'_'+uid).get();if(b.exists&&b.data().type==='like'){const us=[uid,u.id].sort();await db.doc('matches/'+us.join('_')).set({users:us,at:TS()});setTimeout(()=>matchPop(u),250);return setTimeout(next,300)}}}catch(e){alert(e.message)}
  setTimeout(next,300)};
 let sx=0,sy=0,dx=0,drag=false,moved=false;
 top.onpointerdown=e=>{if(e.target.closest('.ibtn'))return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;top.style.transition='none';top.setPointerCapture(e.pointerId)};
 top.onpointermove=e=>{if(!drag)return;dx=e.clientX-sx;const dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;top.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/18}deg)`;sl.style.opacity=Math.max(0,dx/100);sn.style.opacity=Math.max(0,-dx/100)};
 top.onpointerup=e=>{if(!drag)return;drag=false;
  if(dx>110)return act('like');if(dx<-110)return act('pass');
  top.style.transition='transform .25s';top.style.transform='';sl.style.opacity=sn.style.opacity=0;
  if(!moved&&u.photos.length>1){const r=top.getBoundingClientRect();pi=(e.clientX-r.left>r.width/2)?(pi+1)%u.photos.length:(pi-1+u.photos.length)%u.photos.length;top.style.backgroundImage=`url(${u.photos[pi]})`;dots.forEach((d,i)=>d.classList.toggle('on',i===pi))}};

 $('no').onclick=()=>act('pass');$('yes').onclick=()=>act('like');
}
function detail(u){
 const row=(l,v)=>v?`<p style="margin:6px 0"><b>${l} :</b> ${esc(v)}</p>`:'';
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="sheet">${(u.photos||[]).map(p=>`<img class="big" src="${p}">`).join('')}<h2 style="margin:6px 0">${esc(u.name)} ${esc(u.lastName)}${age(u.birth)?', '+age(u.birth)+' ans':''}</h2>
 ${row('Genre',u.gender)}${row('Commune',u.city)}${row('Taille',u.height?u.height+' cm':'')}${row('Profession',u.job)}${row('Université / École',u.school)}${row('Église',u.church)}${row('Religion',u.religion)}${row('Recherche',u.seeking)}
 ${(u.interests||[]).map(i=>`<span class="chip d">${esc(i)}</span>`).join('')}<p>${esc(u.bio)}</p>
 <button class="btn" id="cl">Fermer</button><button class="btn s" id="rp">Signaler ce profil</button></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};$('cl').onclick=()=>o.remove();
 $('rp').onclick=async()=>{try{await db.collection('reports').add({from:uid,about:u.id,at:TS()});alert('Merci, le profil a été signalé.')}catch(e){alert(e.message)}o.remove()};
}
function matchPop(u){const o=document.createElement('div');o.className='ov';o.style.alignItems='center';

 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};
 const done=()=>{try{localStorage.setItem('bf',JSON.stringify(flt))}catch(e){}o.remove();viewSwipe()};

/* ---- Matchs & chat ---- */
async function viewMatches(){
 spin();
 try{const s=await db.collection('matches').where('users','array-contains',uid).get();
  if(s.empty){app.innerHTML='<div class="box muted"><h2>Pas encore de match</h2><p>Continue à swiper !</p></div>';return}
  app.innerHTML='<h3>Mes matchs</h3><div id="l"></div>';
  for(const m of s.docs){const oid=m.data().users.find(x=>x!==uid),d=await db.doc('users/'+oid).get(),u=d.exists?{id:oid,...d.data()}:{id:oid,name:'Utilisateur'};
   const it=document.createElement('div');it.className='item';it.innerHTML=`<div class="av" style="${bg(u)}">${u.photos?'':esc((u.name||'?')[0])}</div><div><b>${esc(u.name)}</b><div class="muted" style="text-align:left;font-size:13px">${[u.job,u.city].filter(Boolean).map(esc).join(' · ')}</div></div>`;
   it.onclick=()=>go('chat',{id:m.id,u});$('l').appendChild(it)}}catch(e){app.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function viewChat(m){
 app.innerHTML=`<div class="item" style="margin-top:0"><button class="btn s" id="bk" style="width:auto;margin:0;padding:8px 12px">←</button><div class="av" style="width:42px;height:42px;${bg(m.u)}"></div><b style="flex:1">${esc(m.u.name)}</b><button class="btn s" id="pf" style="width:auto;margin:0;padding:8px 12px">Profil</button></div>
 <div class="msgs" id="ms"></div><div class="send"><input id="tx" maxlength="1000" placeholder="Message…"><button class="btn" id="sd">Envoyer</button></div>`;
 $('bk').onclick=()=>go('matches');$('pf').onclick=()=>detail(m.u);
 const box=$('ms');unsub=db.collection('matches/'+m.id+'/messages').orderBy('at').onSnapshot(s=>{box.innerHTML='';s.forEach(d=>{const x=d.data(),b=document.createElement('div');b.className='m'+(x.from===uid?' me':'');b.textContent=x.text;box.appendChild(b)});window.scrollTo(0,document.body.scrollHeight)},e=>box.textContent=e.message);
 const send=async()=>{const t=$('tx').value.trim();if(!t)return;$('tx').value='';try{await db.collection('matches/'+m.id+'/messages').add({from:uid,text:t,at:TS()})}catch(e){alert(e.message)}};
 $('sd').onclick=send;$('tx').onkeydown=e=>{if(e.key==='Enter')send()}}

auth.onAuthStateChanged(async u=>{
 stop();if(!u){uid=null;me={};viewAuth();return}
 uid=u.uid;nav.style.display='flex';spin();
 try{const p=await db.doc('users/'+uid).get();me=p.exists?p.data():{}}catch(e){me={}}
 if(!me.name||!me.gender||!(me.photos&&me.photos.length)){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==='profile'));viewProfile(true)}else go('swipe')});
