const age=b=>{if(!b)return null;const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};

/* ---- Connexion ---- */
function viewAuth(mode='in'){
 nav.style.display='none';$('hf').style.display='none';buildNav();
 app.innerHTML=`<div class="box"><div class="hero">${LOGO(72)}<h1>Bolingo</h1><div class="muted">${t('Rencontres')}</div></div>
 <div class="tabs"><button id="t1" class="${mode==='in'?'on':''}">${t('Connexion')}</button><button id="t2" class="${mode==='up'?'on':''}">${t('Inscription')}</button></div>
 <form id="f"><input id="em" type="email" placeholder="${t('E-mail')}" autocomplete="email" required>
 <input id="pw" type="password" placeholder="${t('Mot de passe')}" autocomplete="${mode==='in'?'current-password':'new-password'}" required minlength="6">
 <div class="err" id="err"></div><button class="btn" id="go">${mode==='in'?t('Se connecter'):t('Créer mon compte')}</button></form>
 <button class="btn s" id="gg">${t('Continuer avec Google')}</button>
 ${mode==='in'?`<p class="muted"><a href="#" id="fg">${t('Mot de passe oublié ?')}</a></p>`:''}
 <p class="muted"><a href="#" id="lg2">${lang==='fr'?'English':'Français'}</a></p></div>`;
 $('t1').onclick=()=>viewAuth('in');$('t2').onclick=()=>viewAuth('up');
 $('lg2').onclick=e=>{e.preventDefault();setLang(lang==='fr'?'en':'fr',()=>viewAuth(mode))};
 const er=m=>$('err').textContent=m;
 $('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;er('');
  try{const a=$('em').value.trim(),b=$('pw').value;mode==='in'?await auth.signInWithEmailAndPassword(a,b):await auth.createUserWithEmailAndPassword(a,b)}catch(x){er(fr(x));$('go').disabled=false}};
 $('gg').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(x){er(fr(x))}};
 if($('fg'))$('fg').onclick=async e=>{e.preventDefault();const a=$('em').value.trim();if(!a)return er(L('Entre ton e-mail puis touche « Mot de passe oublié ».','Enter your email then tap “Forgot password?”.'));
  try{await auth.sendPasswordResetEmail(a);er('');alert(L('E-mail de réinitialisation envoyé.','Reset email sent.'))}catch(x){er(fr(x))}}}

const REL=['','Chrétien','Catholique','Protestant','Musulman','Kimbanguiste','Autre','Sans religion'],INT=['','Amitié','Relation sérieuse','Rencontre amoureuse','Discussion','Réseau social'];
function resize(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(file)})}
async function claimRef(){const r=LS.g('ref');if(r&&r!==uid){try{await db.doc('referrals/'+uid).set({inviter:r,at:TS()})}catch(e){}}LS.s('ref','')}
function viewProfile(first){
 const p=me,photos=[...(p.photos||[])];
 const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option value="${x}" ${x===v?'selected':''}>${x?t(x):''}</option>`).join('')}</select>`;
 const inp=(id,l,v,ty='text',x='')=>`<label>${t(l)}</label><input id="${id}" type="${ty}" value="${esc(v)}" ${x}>`;
 app.innerHTML=`<div class="box"><h2 style="margin-top:0">${first?t('Crée ton profil'):t('Mon profil')}</h2>
 <label>${t('Photos (1 à 3, la première est la principale)')}</label><div class="ph" id="ph"></div><input id="file" type="file" accept="image/*" style="display:none">
 <div class="g">${inp('name','Prénom *',p.name,'text','maxlength=40')}${inp('lastName','Nom',p.lastName,'text','maxlength=40')}</div>
 <div class="g"><div><label>${t('Genre *')}</label>${sel('gender',['','Homme','Femme'],p.gender)}</div><div><label>${t('Je recherche')}</label>${sel('seeking',['Tous','Homme','Femme'],p.seeking||'Tous')}</div></div>
 ${inp('birth','Date de naissance * (18 ans min.)',p.birth,'date')}
 <label>${t('Intention')}</label>${sel('intent',INT,p.intent)}
 <div class="g">${inp('city','Commune / Ville',p.city)}${inp('height','Taille (cm)',p.height,'number','min=120 max=230')}</div>
 ${inp('job','Poste / Profession',p.job)}${inp('school','Université / École',p.school)}${inp('church','Église / Communauté',p.church)}
 <label>${t('Religion')}</label>${sel('religion',REL,p.religion)}
 ${inp('interests','Centres d’intérêt (séparés par des virgules)',(p.interests||[]).join(', '))}
 <label>${t('À propos de moi')}</label><textarea id="bio" rows="4" maxlength="400">${esc(p.bio)}</textarea>
 <div class="err" id="err"></div><button class="btn" id="save">${t('Enregistrer')}</button></div>`;
 const draw=()=>{$('ph').innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');if(photos[i]){d.style.backgroundImage=`url(${photos[i]})`;const b=document.createElement('button');b.textContent='✕';b.onclick=()=>{photos.splice(i,1);draw()};d.appendChild(b)}else{d.textContent='+';d.onclick=()=>$('file').click()}$('ph').appendChild(d)}};draw();
 $('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{photos.push(await resize(f));draw()}catch(x){$('err').textContent=t('Photo illisible.')}};
 const v=id=>$(id).value.trim(),er=m=>$('err').textContent=m;
 $('save').onclick=async()=>{
  if(!v('name'))return er(t('Le prénom est obligatoire.'));if(!$('gender').value)return er(t('Choisis ton genre.'));
  const a=age(v('birth'));if(a===null||a<18)return er(t('Tu dois avoir 18 ans ou plus.'));if(!photos.length)return er(t('Ajoute au moins une photo.'));
  const d={name:v('name'),lastName:v('lastName'),gender:$('gender').value,seeking:$('seeking').value,intent:$('intent').value,birth:v('birth'),city:v('city'),height:Number(v('height'))||null,job:v('job'),school:v('school'),church:v('church'),religion:$('religion').value,interests:v('interests').split(',').map(s=>s.trim()).filter(Boolean).slice(0,12),bio:v('bio'),photos};
  const isNew=!me.name;$('save').disabled=true;
  try{await db.doc('users/'+uid).set(d,{merge:true});me={...me,...d};if(isNew)await claimRef();go('swipe')}catch(x){er(x.message);$('save').disabled=false}}}

function pass(u){
 if(u.id===uid||!u.name||!(u.photos&&u.photos.length)||u.hidden||blocked.has(u.id))return false;
 if(flt.intent&&u.intent!==flt.intent)return false;
 const a=age(u.birth),Lw=s=>(s||'').toLowerCase();
 if(me.seeking&&me.seeking!=='Tous'&&u.gender!==me.seeking)return false;
 if(u.seeking&&u.seeking!=='Tous'&&me.gender&&me.gender!==u.seeking)return false;
 if(flt.amin&&a<flt.amin)return false;if(flt.amax&&a>flt.amax)return false;if(flt.hmin&&(u.height||0)<flt.hmin)return false;

   el.onclick=()=>viewStory(by[id].sort((a,b)=>a.expiresAt-b.expiresAt),u);so.appendChild(el)})}catch(e){}}
function addStory(){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const img=await resize(f),text=prompt(L('Ajoute un texte (facultatif)','Add a caption (optional)'))||'';await db.collection('stories').add({from:uid,img,text:text.slice(0,140),at:TS(),expiresAt:Date.now()+864e5});viewMoments()}catch(e){alert(e.message)}};i.click()}
function viewStory(list,u){let i=0;const v=document.createElement('div');v.className='view';
 const draw=()=>{const s=list[i];
  v.innerHTML=`<div style="padding:12px 14px;display:flex;justify-content:space-between"><b>${esc(u.name)} · ${ago(s.at)}</b><span>${s.from===uid?'<button id="sd2" style="background:none;border:0;color:#fff;font-size:18px">🗑</button> ':''}<button id="sx" style="background:none;border:0;color:#fff;font-size:22px">✕</button></span></div><img src="${s.img}"><p style="text-align:center;padding:10px">${esc(s.text)}</p>`;
  $('sx').onclick=e=>{e.stopPropagation();v.remove()};
  if($('sd2'))$('sd2').onclick=async e=>{e.stopPropagation();try{await db.collection('stories').doc(s.id).delete()}catch(x){alert(x.message)}v.remove();viewMoments()}};
 v.onclick=()=>{i++;if(i>=list.length)v.remove();else draw()};draw();document.body.appendChild(v)}
async function loadFeed(){const fd=$('fd');
 try{const s=await db.collection('posts').orderBy('at','desc').limit(30).get();fd.innerHTML='';let n=0;
  s.forEach(d=>{const p={id:d.id,...d.data()};if(blocked.has(p.from))return;n++;fd.appendChild(postEl(p))});
  if(!n)fd.innerHTML=`<div class="box muted"><p>${L('Aucune publication. Sois le premier !','No posts yet. Be the first!')}</p></div>`}catch(e){fd.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function postEl(p){
 const u=uOf(p.from),el=document.createElement('div');el.className='post';
 const draw=()=>{const lk=(p.likes||[]).includes(uid);
  el.innerHTML=`<div class="h"><div class="av" style="${bg(u)}">${u.photos?'':esc((u.name||'?')[0])}</div><div style="flex:1"><b>${esc(u.name)} ${esc(u.lastName)}</b><div class="muted" style="text-align:left;font-size:12px">${ago(p.at)}</div></div><button class="ibt" id="mo" style="width:36px;height:36px;font-size:18px;box-shadow:none;background:none">⋯</button></div>${p.text?`<p style="white-space:pre-wrap;margin:8px 0 0">${esc(p.text)}</p>`:''}${p.img?`<img class="pi" src="${p.img}">`:''}<div class="a"><button id="lk" class="${lk?'on':''}">${lk?'❤️':'🤍'} ${(p.likes||[]).length}</button><button id="cm">💬 ${t('Commenter')}</button></div>`;
  el.querySelector('.av').onclick=()=>{if(u.name!=='?')detail(u,{like:p.from!==uid})};
  el.querySelector('#lk').onclick=async()=>{const R=db.doc('posts/'+p.id);p.likes=p.likes||[];
   try{if(lk){await R.update({likes:firebase.firestore.FieldValue.arrayRemove(uid)});p.likes=p.likes.filter(x=>x!==uid)}else{await R.update({likes:firebase.firestore.FieldValue.arrayUnion(uid)});p.likes.push(uid)}draw()}catch(e){alert(e.message)}};
  el.querySelector('#cm').onclick=()=>comments(p);
  el.querySelector('#mo').onclick=async()=>{
   if(p.from===uid){if(confirm(L('Supprimer cette publication ?','Delete this post?'))){try{await db.doc('posts/'+p.id).delete();el.remove()}catch(e){alert(e.message)}}}
   else if(confirm(L('Signaler cette publication ?','Report this post?'))){try{await db.collection('reports').add({from:uid,about:p.from,post:p.id,at:TS()});alert(L('Merci, signalement envoyé.','Thanks, report sent.'))}catch(e){alert(e.message)}}}};
 draw();return el}
async function comments(p){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="sheet"><h3 style="margin-top:0">💬 ${t('Commentaires')}</h3><div id="cl2"><div class="spin"></div></div><div style="display:flex;gap:8px"><input id="ci" maxlength="500" placeholder="${t('Écrire un commentaire…')}" style="margin:0"><button class="btn" id="cs" style="width:90px;margin:0">${t('Envoyer')}</button></div></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};
 const C=db.collection('posts/'+p.id+'/comments'),add=x=>{const u=uOf(x.from),d=document.createElement('p');d.style.margin='6px 0';d.innerHTML=`<b>${esc(u.name)}</b> ${esc(x.text)}`;$('cl2').appendChild(d)};
 try{const s=await C.orderBy('at').get();$('cl2').innerHTML='';if(s.empty)$('cl2').innerHTML=`<p class="muted">${L('Aucun commentaire.','No comments.')}</p>`;s.forEach(d=>{if(!blocked.has(d.data().from))add(d.data())})}catch(e){$('cl2').textContent=e.message}
 $('cs').onclick=async()=>{const tx=$('ci').value.trim();if(!tx)return;$('ci').value='';try{await C.add({from:uid,text:tx,at:TS()});if($('cl2').querySelector('.muted'))$('cl2').innerHTML='';add({from:uid,text:tx})}catch(e){alert(e.message)}}}

/* ---- Démarrage ---- */
document.documentElement.lang=lang;if(LS.g('dm'))document.body.classList.add('dark');buildNav();
auth.onAuthStateChanged(async u=>{
 stop();if(!u){uid=null;me={};viewAuth();return}
 uid=u.uid;nav.style.display='flex';buildNav();spin();
 try{const p=await db.doc('users/'+uid).get();me=p.exists?p.data():{}}catch(e){me={}}
 try{blocked=new Set();(await db.collection('blocks').where('by','==',uid).get()).forEach(d=>blocked.add(d.data().target));favs=new Set();(await db.collection('favs').where('by','==',uid).get()).forEach(d=>favs.add(d.data().target));cleanStories()}catch(e){}
 if(!me.name||!me.gender||!(me.photos&&me.photos.length)){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==='profile'));viewProfile(true)}else go('swipe')});
</script></body></html>
